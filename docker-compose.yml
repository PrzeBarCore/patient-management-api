services:
  postgres:
    image: postgres:16
    container_name: laboratoryManagement-db
    environment:
      POSTGRES_DB: laboratoryManagement
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
