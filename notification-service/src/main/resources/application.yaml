spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notificationservice
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: localhost
    port: 1025
notification-delivery:
  sender-type: email
  scheduler-enabled: true
  scheduler-fixed-delay: 10000
  max-attempts-count: 4
  email:
    recipient: test@example.com
    from: laboratory@example.com